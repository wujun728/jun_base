<!DOCTYPE html>
<html lang="zh_CN">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>缓存监控</title>
    <link rel="stylesheet" href="/assets/libs/layui/css/layui.css"/>
    <link rel="stylesheet" href="/assets/module/admin.css">
</head>
<body>
<!-- 正文开始 -->
<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-sm12 layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header" style="font-weight: bolder">Redis 基本信息</div>
                <div class="layui-card-body">
                    <table class="layui-table">
                        <thead>
                        <tr>
                            <th>属性</th>
                            <th>值</th>
                        </tr>
                        </thead>
                        <tbody id="redisInfoBox"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="layui-col-sm12 layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header" style="font-weight: bolder">命令统计</div>
                <div class="layui-card-body">
                    <table class="layui-table">
                        <thead>
                        <tr>
                            <th>命令</th>
                            <th>调用次数</th>
                        </tr>
                        </thead>
                        <tbody id="commandStatsBox"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="layui-col-sm12 layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header" style="font-weight: bolder">缓存列表</div>
                <div class="layui-card-body">
                    <table class="layui-table">
                        <thead>
                        <tr>
                            <th>缓存名称</th>
                            <th>备注</th>
                        </tr>
                        </thead>
                        <tbody id="cacheNameBox"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- js部分 -->
<script src="/assets/libs/layui/layui.js"></script>
<script src="/assets/js/jquery.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/core.util.js"></script>

<script>
    layui.use(['layer'], function () {
        var $ = layui.jquery;

        // Redis 基本信息 + 命令统计
        CoreUtil.sendGet("/dev-api/monitor/cache", {}, function (res) {
            if (res.code == 0 || res.code == 200) {
                var info = res.data.info || {};
                var infoKeys = [
                    "redis_version", "redis_mode", "connected_clients", "used_memory_human",
                    "used_memory_peak_human", "uptime_in_days", "total_connections_received",
                    "total_commands_processed", "os", "arch_bits"
                ];
                var infoHtml = '';
                $.each(infoKeys, function (i, k) {
                    if (info[k] !== undefined) {
                        infoHtml += '<tr><td>' + k + '</td><td>' + info[k] + '</td></tr>';
                    }
                });
                if (res.data.dbSize !== undefined) {
                    infoHtml += '<tr><td>dbSize</td><td>' + res.data.dbSize + '</td></tr>';
                }
                $('#redisInfoBox').html(infoHtml);

                var cmds = (res.data.commandStats || []).sort(function (a, b) {
                    return (parseInt(b.value) || 0) - (parseInt(a.value) || 0);
                });
                var cmdHtml = '';
                $.each(cmds, function (i, c) {
                    cmdHtml += '<tr><td>' + c.name + '</td><td>' + c.value + '</td></tr>';
                });
                $('#commandStatsBox').html(cmdHtml);
            }
        });

        // 缓存名称列表
        CoreUtil.sendGet("/dev-api/monitor/cache/getNames", {}, function (res) {
            if (res.code == 0 || res.code == 200) {
                var html = '';
                $.each(res.data || [], function (i, c) {
                    html += '<tr><td>' + c.cacheName + '</td><td>' + c.remark + '</td></tr>';
                });
                $('#cacheNameBox').html(html);
            }
        });
    });
</script>
</body>
</html>

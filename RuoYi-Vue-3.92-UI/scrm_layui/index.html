<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href="/assets/images/favicon.ico" rel="icon">
    <title>齐兴会计师事务所信息系统- 首页</title>
    <link rel="stylesheet" href="/assets/libs/layui/css/layui.css"/>
    <link rel="stylesheet" href="/assets/module/admin.css">
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style>
		.layui-layer-tab .layui-layer-title span.layui-this {
			height: 51px;
			border-left-color: #eee;
			border-right-color: #eee;
			background-color: #8c8c8c;
			z-index: 10;
		}
	</style>
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">
    <!-- 头部 -->
    <div class="layui-header">
        <div class="layui-logo">
            <img src="/assets/images/logo.png"/>
            <cite>&nbsp;齐兴会计师事务所</cite>
        </div>
        <ul class="layui-nav layui-layout-left" id="snowy-nav-top-box">
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="flexible" title="侧边伸缩"><i class="layui-icon layui-icon-shrink-right"></i></a>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="refresh" title="刷新"><i class="layui-icon layui-icon-refresh-3"></i></a>
            </li>
        </ul>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="message" title="消息">
                    <i class="layui-icon layui-icon-notice"></i>
                    <span class="layui-badge-dot"></span>
                </a>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="note" title="便签"><i class="layui-icon layui-icon-note"></i></a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect>
                <a ew-event="fullScreen" title="全屏"><i class="layui-icon layui-icon-screen-full"></i></a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect>
                <a ew-event="lockScreen" title="锁屏"><i class="layui-icon layui-icon-password"></i></a>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a>
                    <img src="/assets/images/head.jpg" class="layui-nav-img">
                    <cite id="loginUserName">管理员</cite>
                </a>
                <dl class="layui-nav-child">
                    <dd lay-unselect><a ew-href="page/template/user-info.html">个人中心</a></dd>
                    <dd lay-unselect><a ew-event="psw"  data-url="page/tpl/tpl-password.html">修改密码</a></dd>

                    <hr>
                    <dd lay-unselect><a ew-event="logout" data-url="login.html">退出</a></dd>
                </dl>
            </li>
            <li class="layui-nav-item" lay-unselect>
                <a ew-event="theme" title="主题"><i class="layui-icon layui-icon-more-vertical"></i></a>
            </li>
        </ul>
    </div>

    <!-- 侧边栏 -->
    <div class="layui-side">
        <div class="layui-side-scroll">

        </div>
    </div>

    <!-- 主体部分 -->
    <div class="layui-body"></div>
</div>

<!-- 加载动画 -->
<div class="page-loading">
    <div class="ball-loader">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<!-- js部分 -->
<script src="/assets/libs/layui/layui.js"></script>
<script src="/assets/js/jquery.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/core.util.js"></script>

<script>
    layui.use(['layer', 'element', 'admin', 'index', 'notice', 'xnUtil'], function () {
        var $ = layui.jquery;
        var admin = layui.admin;
        var index = layui.index;
        var element = layui.element;
        var xnUtil = layui.xnUtil;

        //缓存字典
        xnUtil.cacheDictData();

        // 若依菜单图标 -> layui 图标映射（未匹配的使用默认菜单图标）
        var iconMap = {
            'system': 'layui-icon-set',
            'user': 'layui-icon-username',
            'peoples': 'layui-icon-group',
            'tree': 'layui-icon-tree',
            'tree-table': 'layui-icon-tree',
            'post': 'layui-icon-username',
            'dict': 'layui-icon-note',
            'form': 'layui-icon-form',
            'message': 'layui-icon-notice',
            'log': 'layui-icon-log',
            'online': 'layui-icon-user',
            'job': 'layui-icon-time',
            'druid': 'layui-icon-loading',
            'server': 'layui-icon-release',
            'cache': 'layui-icon-set',
            'tool': 'layui-icon-util',
            'build': 'layui-icon-util',
            'code': 'layui-icon-code-circle',
            'swagger': 'layui-icon-release',
            'monitor': 'layui-icon-chart-screen'
        };

        function menuTitle(menu) {
            return (menu.meta && menu.meta.title) ? menu.meta.title : (menu.name || '');
        }

        function menuIcon(menu) {
            var ic = menu.meta && menu.meta.icon ? menu.meta.icon : '';
            return iconMap[ic] || 'layui-icon-menu';
        }

        function isInvalidComponent(component) {
            return !component || component === 'Layout' || component === 'InnerLink' || component === 'ParentView';
        }

        // 递归渲染若依 getRouters 返回的 RouterVo 树
        function renderMenus(menus) {
            var html = '';
            layui.each(menus || [], function (i, menu) {
                if (menu.hidden) return;
                var children = [];
                layui.each(menu.children || [], function (j, c) {
                    if (!c.hidden) children.push(c);
                });
                if (children.length > 0) {
                    html += '<li class="layui-nav-item"><a><i class="layui-icon ' + menuIcon(menu) + '"></i>&emsp;<cite>' + menuTitle(menu) + '</cite></a>';
                    html += '<dl class="layui-nav-child">' + renderMenus(children) + '</dl></li>';
                } else {
                    if (isInvalidComponent(menu.component)) return;
                    var url = menu.component + '.html';
                    html += '<dd><a lay-href="' + url + '"><i class="layui-icon ' + menuIcon(menu) + '"></i>&emsp;<cite>' + menuTitle(menu) + '</cite></a></dd>';
                }
            });
            return html;
        }

        // 获取用户信息
        CoreUtil.sendGet("/dev-api/getInfo", {}, function (res) {
            layui.data(admin.setter.tableName, {key: 'loginUser', value: res});
            var userProfile = res.user;
            if (userProfile) {
                CoreUtil.setData("userProfile", userProfile);
                if (userProfile.userName) {
                    $('#loginUserName').text(userProfile.userName);
                }
            }
        });

        // 获取路由菜单并渲染
        CoreUtil.sendGet("/dev-api/getRouters", {}, function (res) {
            var menus = res.data || [];
            var html = '<ul class="layui-nav layui-nav-tree" lay-shrink="_all" lay-filter="admin-side-nav" style="margin: 15px 0;">'
                + renderMenus(menus) + '</ul>';
            $('.layui-side-scroll').html(html);
            element.render('nav');

            var curtheme = layui.data(admin.setter.tableName)['defaultTheme'];
            if (curtheme) {
                admin.changeTheme(curtheme);
            } else {
                admin.changeTheme('theme-snowy');
            }

            // 默认加载主页
            index.loadHome({
                menuPath: '/home/index/main.html',
                menuName: '<i class="layui-icon layui-icon-home"></i>',
                loadSetting: true,
                onlyLast: true
            });
        });
    });
</script>
</body>
</html>

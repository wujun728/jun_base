# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.9
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port:  8084
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis-Plus配置
mybatis-plus:
  # 搜索指定包别名 (如果实体类和VO分开，需要都包含)
  type-aliases-package: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件 (确认路径是否正确)
  mapper-locations: classpath*:/mapper/**/*Mapper.xml
  # 加载全局的配置文件 (如果 mybatis-config.xml 还有其他必要配置则保留，否则可以移除或注释掉)
  config-location: classpath:mybatis/mybatis-config.xml
  global-config:
    db-config:
      id-type: auto
      field-strategy: not_null
  # 禁用MyBatis-Plus分页插件
#  default-scripting-language: org.apache.ibatis.scripting.xmltags.XMLLanguageDriver
#  configuration:
#    # 开启驼峰命名转换 Table(create_time) -> Entity(createTime)
#    map-underscore-to-camel-case: true
#    # 当列值为 null 时，也要调用 setter/getter
#    call-setters-on-nulls: true
#    # 配置JdbcTypeForNull, 对于 Oracle 等数据库是必须的
#    jdbc-type-for-null: 'null'
#  global-config:
#    db-config:
#      # 主键类型: AUTO(数据库自增) INPUT(用户输入) ASSIGN_ID(雪花算法) ASSIGN_UUID(UUID)
#      # RuoYi 通常使用自增ID，如果数据库和实体已配置，则无需全局指定。若要改用雪花，确保有相应配置类。
#      # id-type: auto
#      # 逻辑删除配置 (如果需要全局配置)
#      # logic-delete-field: deleted # 全局逻辑删除字段名
#      # logic-delete-value: 1 # 逻辑已删除值
#      # logic-not-delete-value: 0 # 逻辑未删除值
#    # 关闭启动时的 Banner
#    banner: false

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*


<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>用户管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
    <link rel="stylesheet" href="../../static/ruoyi.css">
    <style>
        .head-container { padding-bottom: 10px; }
        .el-tree { min-height: 200px; }
        .dept-tree-wrap { min-width: 200px; padding: 10px; }
        .user-table-wrap { padding: 10px; flex: 1; overflow: hidden; }
        .main-flex { display: flex; }
        .dept-tree-wrap .el-tree--highlight-current .el-tree-node.is-current > .el-tree-node__content {
            background-color: #409EFF; color: #fff;
        }
    </style>
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="app-container main-flex">
            <!-- 左侧部门树 -->
            <div class="dept-tree-wrap">
                <div class="head-container">
                    <el-input v-model="deptName" placeholder="请输入部门名称" clearable size="small" prefix-icon="el-icon-search"></el-input>
                </div>
                <div class="tree-border">
                    <el-tree
                        :data="deptOptions"
                        :props="defaultProps"
                        :expand-on-click-node="false"
                        :filter-node-method="filterNode"
                        ref="tree"
                        node-key="id"
                        default-expand-all
                        highlight-current
                        @node-click="handleNodeClick"
                    ></el-tree>
                </div>
            </div>
            <!-- 右侧用户表格 -->
            <div class="user-table-wrap">
                <!-- 搜索区域 -->
                <el-form :model="queryParams" ref="queryForm" size="small" :inline="true" label-width="68px">
                    <el-form-item label="用户名称" prop="userName">
                        <el-input v-model="queryParams.userName" placeholder="请输入用户名称" clearable @keyup.enter.native="handleQuery"></el-input>
                    </el-form-item>
                    <el-form-item label="手机号码" prop="phonenumber">
                        <el-input v-model="queryParams.phonenumber" placeholder="请输入手机号码" clearable @keyup.enter.native="handleQuery"></el-input>
                    </el-form-item>
                    <el-form-item label="状态" prop="status">
                        <el-select v-model="queryParams.status" placeholder="用户状态" clearable>
                            <el-option v-for="dict in sysNormalDisableOptions" :key="dict.value" :label="dict.label" :value="dict.value"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="创建时间">
                        <el-date-picker
                            v-model="dateRange"
                            type="daterange"
                            range-separator="-"
                            start-placeholder="开始日期"
                            end-placeholder="结束日期"
                            value-format="yyyy-MM-dd"
                        ></el-date-picker>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" icon="el-icon-search" size="mini" @click="handleQuery">搜索</el-button>
                        <el-button icon="el-icon-refresh" size="mini" @click="resetQuery">重置</el-button>
                    </el-form-item>
                </el-form>

                <!-- 操作按钮行 -->
                <el-row :gutter="10" class="mb8">
                    <el-col :span="1.5">
                        <el-button type="primary" plain icon="el-icon-plus" size="mini" @click="handleAdd" v-hasPermi="['system:user:add']">新增</el-button>
                    </el-col>
                    <el-col :span="1.5">
                        <el-button type="success" plain icon="el-icon-edit" size="mini" :disabled="single" @click="handleUpdate" v-hasPermi="['system:user:edit']">修改</el-button>
                    </el-col>
                    <el-col :span="1.5">
                        <el-button type="danger" plain icon="el-icon-delete" size="mini" :disabled="multiple" @click="handleDelete" v-hasPermi="['system:user:remove']">删除</el-button>
                    </el-col>
                    <el-col :span="1.5">
                        <el-button type="info" plain icon="el-icon-upload2" size="mini" @click="handleImport" v-hasPermi="['system:user:import']">导入</el-button>
                    </el-col>
                    <el-col :span="1.5">
                        <el-button type="warning" plain icon="el-icon-download" size="mini" @click="handleExport" v-hasPermi="['system:user:export']">导出</el-button>
                    </el-col>
                    <div class="top-right-btn">
                        <el-tooltip content="刷新" placement="top">
                            <el-button size="mini" circle icon="el-icon-refresh" @click="getList"></el-button>
                        </el-tooltip>
                    </div>
                </el-row>

                <!-- 用户表格 -->
                <el-table v-loading="loading" :data="userList" @selection-change="handleSelectionChange">
                    <el-table-column type="selection" width="50" align="center"></el-table-column>
                    <el-table-column label="用户编号" align="center" prop="userId" width="80"></el-table-column>
                    <el-table-column label="用户名称" align="center" prop="userName" :show-overflow-tooltip="true"></el-table-column>
                    <el-table-column label="用户昵称" align="center" prop="nickName" :show-overflow-tooltip="true"></el-table-column>
                    <el-table-column label="部门" align="center" prop="dept.deptName" :show-overflow-tooltip="true"></el-table-column>
                    <el-table-column label="手机号码" align="center" prop="phonenumber" width="120"></el-table-column>
                    <el-table-column label="状态" align="center" width="100">
                        <template slot-scope="scope">
                            <el-switch
                                v-model="scope.row.status"
                                active-value="0"
                                inactive-value="1"
                                @change="handleStatusChange(scope.row)"
                            ></el-switch>
                        </template>
                    </el-table-column>
                    <el-table-column label="创建时间" align="center" prop="createTime" width="160">
                        <template slot-scope="scope">
                            <span>{{ parseTime(scope.row.createTime) }}</span>
                        </template>
                    </el-table-column>
                    <el-table-column label="操作" align="center" width="200" class-name="fixed-width">
                        <template slot-scope="scope" v-if="scope.row.userId !== 1">
                            <el-button size="mini" type="text" icon="el-icon-edit" @click="handleUpdate(scope.row)" v-hasPermi="['system:user:edit']">修改</el-button>
                            <el-button size="mini" type="text" icon="el-icon-delete" @click="handleDelete(scope.row)" v-hasPermi="['system:user:remove']">删除</el-button>
                            <el-dropdown size="mini" @command="(command) => handleCommand(command, scope.row)" v-hasPermi="['system:user:resetPwd', 'system:user:edit']">
                                <el-button size="mini" type="text" icon="el-icon-d-arrow-right">更多</el-button>
                                <el-dropdown-menu slot="dropdown">
                                    <el-dropdown-item command="handleResetPwd" icon="el-icon-key" v-hasPermi="['system:user:resetPwd']">重置密码</el-dropdown-item>
                                    <el-dropdown-item command="handleAuthRole" icon="el-icon-circle-check" v-hasPermi="['system:user:edit']">分配角色</el-dropdown-item>
                                </el-dropdown-menu>
                            </el-dropdown>
                        </template>
                    </el-table-column>
                </el-table>

                <!-- 分页 -->
                <div class="pagination-container">
                    <el-pagination
                        background
                        @size-change="handleSizeChange"
                        @current-change="handleCurrentChange"
                        :current-page="queryParams.pageNum"
                        :page-sizes="[10, 20, 50]"
                        :page-size="queryParams.pageSize"
                        layout="total, sizes, prev, pager, next, jumper"
                        :total="total"
                    ></el-pagination>
                </div>

                <!-- 添加或修改用户对话框 -->
                <el-dialog :title="title" :visible.sync="open" width="680px" append-to-body :close-on-click-modal="false">
                    <el-form ref="form" :model="form" :rules="rules" label-width="80px">
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="用户昵称" prop="nickName">
                                    <el-input v-model="form.nickName" placeholder="请输入用户昵称" maxlength="30"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="归属部门" prop="deptId">
                                    <el-tree-select
                                        v-if="deptTreeSelectReady"
                                        v-model="form.deptId"
                                        :data="deptOptions"
                                        :props="{ value: 'id', label: 'label', children: 'children' }"
                                        placeholder="请选择归属部门"
                                        check-strictly
                                        filterable
                                    ></el-tree-select>
                                    <el-popover v-else placement="bottom-start" trigger="click" ref="deptPopover">
                                        <el-tree
                                            :data="deptOptions"
                                            :props="defaultProps"
                                            :expand-on-click-node="false"
                                            :filter-node-method="filterNode"
                                            ref="deptSelectTree"
                                            node-key="id"
                                            default-expand-all
                                            highlight-current
                                            @node-click="handleDeptSelect"
                                        ></el-tree>
                                        <el-input slot="reference" v-model="deptSelectName" placeholder="请选择归属部门" readonly></el-input>
                                    </el-popover>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="手机号码" prop="phonenumber">
                                    <el-input v-model="form.phonenumber" placeholder="请输入手机号码" maxlength="11"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="邮箱" prop="email">
                                    <el-input v-model="form.email" placeholder="请输入邮箱" maxlength="50"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item v-if="form.userId == undefined" label="用户名称" prop="userName">
                                    <el-input v-model="form.userName" placeholder="请输入用户名称" maxlength="30"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item v-if="form.userId == undefined" label="用户密码" prop="password">
                                    <el-input v-model="form.password" placeholder="请输入用户密码" type="password" maxlength="20" show-password></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="用户性别" prop="sex">
                                    <el-select v-model="form.sex" placeholder="请选择性别" style="width: 100%;">
                                        <el-option v-for="dict in sysUserSexOptions" :key="dict.value" :label="dict.label" :value="dict.value"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="状态" prop="status">
                                    <el-radio-group v-model="form.status">
                                        <el-radio v-for="dict in sysNormalDisableOptions" :key="dict.value" :label="dict.value">{{dict.label}}</el-radio>
                                    </el-radio-group>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="12">
                                <el-form-item label="岗位" prop="postIds">
                                    <el-select v-model="form.postIds" multiple placeholder="请选择岗位" style="width: 100%;">
                                        <el-option v-for="item in postOptions" :key="item.postId" :label="item.postName" :value="item.postId" :disabled="item.status == 1"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="角色" prop="roleIds">
                                    <el-select v-model="form.roleIds" multiple placeholder="请选择角色" style="width: 100%;">
                                        <el-option v-for="item in roleOptions" :key="item.roleId" :label="item.roleName" :value="item.roleId" :disabled="item.status == 1"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                        </el-row>
                        <el-row>
                            <el-col :span="24">
                                <el-form-item label="备注" prop="remark">
                                    <el-input v-model="form.remark" type="textarea" placeholder="请输入内容"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                    </el-form>
                    <div slot="footer" class="dialog-footer">
                        <el-button type="primary" @click="submitForm">确 定</el-button>
                        <el-button @click="cancel">取 消</el-button>
                    </div>
                </el-dialog>

                <!-- 用户导入对话框 -->
                <el-dialog title="用户导入" :visible.sync="upload.open" width="400px" append-to-body>
                    <el-upload
                        ref="upload"
                        :limit="1"
                        accept=".xlsx, .xls"
                        :headers="upload.headers"
                        :action="upload.url"
                        :disabled="upload.isUploading"
                        :on-progress="handleFileUploadProgress"
                        :on-success="handleFileSuccess"
                        :auto-upload="false"
                        drag
                    >
                        <i class="el-icon-upload"></i>
                        <div class="el-upload__text">将文件拖到此处，或<em>点击上传</em></div>
                        <div class="el-upload__tip" slot="tip">
                            <el-checkbox v-model="upload.updateSupport">是否更新已经存在的用户数据</el-checkbox>
                            <el-link type="primary" :underline="false" style="font-size:12px;vertical-align:baseline;" @click="importTemplate">下载模板</el-link>
                        </div>
                    </el-upload>
                    <div slot="footer" class="dialog-footer">
                        <el-button type="primary" @click="submitFileForm">确 定</el-button>
                        <el-button @click="upload.open = false">取 消</el-button>
                    </div>
                </el-dialog>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/kj/layer/layer.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/ruoyi-util.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                // 遮罩层
                loading: true,
                // 选中数组
                ids: [],
                // 非单个禁用
                single: true,
                // 非多个禁用
                multiple: true,
                // 总条数
                total: 0,
                // 用户表格数据
                userList: [],
                // 弹出层标题
                title: '',
                // 是否显示弹出层
                open: false,
                // 部门树选项
                deptOptions: [],
                // 部门名称
                deptName: '',
                // 默认密码
                initPassword: '123456',
                // 日期范围
                dateRange: [],
                // 岗位选项
                postOptions: [],
                // 角色选项
                roleOptions: [],
                // 表单参数
                form: {},
                defaultProps: {
                    children: 'children',
                    label: 'label'
                },
                // 用户导入参数
                upload: {
                    open: false,
                    title: '',
                    isUploading: false,
                    updateSupport: false,
                    headers: { Authorization: 'Bearer ' + ruoyi.getToken() },
                    url: '/prod-api/system/user/importData'
                },
                // 查询参数
                queryParams: {
                    pageNum: 1,
                    pageSize: 10,
                    userName: undefined,
                    phonenumber: undefined,
                    status: undefined,
                    deptId: undefined
                },
                // 表单校验
                rules: {
                    userName: [
                        { required: true, message: '用户名称不能为空', trigger: 'blur' },
                        { min: 2, max: 20, message: '用户名称长度必须介于 2 和 20 之间', trigger: 'blur' }
                    ],
                    nickName: [
                        { required: true, message: '用户昵称不能为空', trigger: 'blur' }
                    ],
                    password: [
                        { required: true, message: '用户密码不能为空', trigger: 'blur' },
                        { min: 5, max: 20, message: '用户密码长度必须介于 5 和 20 之间', trigger: 'blur' }
                    ],
                    email: [
                        { type: 'email', message: '请输入正确的邮箱地址', trigger: ['blur', 'change'] }
                    ],
                    phonenumber: [
                        { pattern: /^1[3|4|5|6|7|8|9][0-9]\d{8}$/, message: '请输入正确的手机号码', trigger: 'blur' }
                    ]
                },
                // 字典选项
                sysNormalDisableOptions: [],
                sysUserSexOptions: [],
                // 部门选择相关
                deptSelectName: '',
                deptTreeSelectReady: false
            },
            watch: {
                // 部门名称筛选
                deptName: function(val) {
                    this.$refs.tree.filter(val);
                }
            },
            methods: {
                /** 查询用户列表 */
                getList: function() {
                    this.loading = true;
                    var params = ruoyi.addDateRange(this.queryParams, this.dateRange);
                    ruoyi.get('/system/user/list', params, function(res) {
                        this.userList = res.rows || [];
                        this.total = res.total || 0;
                        this.loading = false;
                    }.bind(this), function() {
                        this.loading = false;
                    }.bind(this));
                },
                /** 查询部门下拉树结构 */
                getDeptTree: function() {
                    ruoyi.get('/system/dept/treeselect', function(res) {
                        this.deptOptions = res.data || [];
                    }.bind(this));
                },
                /** 筛选节点 */
                filterNode: function(value, data) {
                    if (!value) return true;
                    return data.label.indexOf(value) !== -1;
                },
                /** 节点单击事件 */
                handleNodeClick: function(data) {
                    this.queryParams.deptId = data.id;
                    this.handleQuery();
                },
                /** 搜索按钮操作 */
                handleQuery: function() {
                    this.queryParams.pageNum = 1;
                    this.getList();
                },
                /** 重置按钮操作 */
                resetQuery: function() {
                    this.dateRange = [];
                    this.resetForm('queryForm');
                    this.queryParams.deptId = undefined;
                    if (this.$refs.tree) {
                        this.$refs.tree.setCurrentKey(null);
                    }
                    this.handleQuery();
                },
                /** 多选框选中数据 */
                handleSelectionChange: function(selection) {
                    this.ids = selection.map(function(item) { return item.userId; });
                    this.single = selection.length !== 1;
                    this.multiple = !selection.length;
                },
                /** 更多操作 */
                handleCommand: function(command, row) {
                    switch (command) {
                        case 'handleResetPwd':
                            this.handleResetPwd(row);
                            break;
                        case 'handleAuthRole':
                            this.handleAuthRole(row);
                            break;
                        default:
                            break;
                    }
                },
                /** 用户状态修改 */
                handleStatusChange: function(row) {
                    var text = row.status === '0' ? '启用' : '停用';
                    this.$modal.confirm('确认要"' + text + '""' + row.userName + '"用户吗？').then(function() {
                        ruoyi.put('/system/user/changeStatus', { userId: row.userId, status: row.status }, function(res) {
                            this.$modal.msgSuccess(text + '成功');
                        }.bind(this), function() {
                            row.status = row.status === '0' ? '1' : '0';
                        });
                    }.bind(this)).catch(function() {
                        row.status = row.status === '0' ? '1' : '0';
                    });
                },
                /** 新增按钮操作 */
                handleAdd: function() {
                    this.reset();
                    ruoyi.get('/system/user/', function(res) {
                        this.postOptions = res.posts || [];
                        this.roleOptions = res.roles || [];
                        this.open = true;
                        this.title = '添加用户';
                        this.form.password = this.initPassword;
                    }.bind(this));
                },
                /** 修改按钮操作 */
                handleUpdate: function(row) {
                    this.reset();
                    var userId = row.userId || this.ids[0];
                    ruoyi.get('/system/user/' + userId, function(res) {
                        this.form = res.data || {};
                        this.postOptions = res.posts || [];
                        this.roleOptions = res.roles || [];
                        this.form.postIds = res.postIds || [];
                        this.form.roleIds = res.roleIds || [];
                        this.open = true;
                        this.title = '修改用户';
                        this.form.password = '';
                        // 设置部门选择名称
                        this.$nextTick(function() {
                            if (this.form.deptId && this.$refs.deptSelectTree) {
                                var node = this.$refs.deptSelectTree.getNode(this.form.deptId);
                                if (node) {
                                    this.deptSelectName = node.data.label;
                                }
                            }
                        }.bind(this));
                    }.bind(this));
                },
                /** 重置密码按钮操作 */
                handleResetPwd: function(row) {
                    this.$modal.prompt('请输入"' + row.userName + '"的新密码').then(function(ref) {
                        var value = ref.value;
                        if (!value || value.length < 5 || value.length > 20) {
                            this.$modal.msgError('密码长度必须介于 5 和 20 之间');
                            return;
                        }
                        ruoyi.put('/system/user/resetPwd', { userId: row.userId, password: value }, function(res) {
                            this.$modal.msgSuccess('修改成功，新密码是：' + value);
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 分配角色操作 */
                handleAuthRole: function(row) {
                    var userId = row.userId;
                    parent.sa_admin.showTab({
                        id: 'system-user-authRole-' + userId,
                        name: '分配角色',
                        url: 'sa-view/system/user/authRole.html?userId=' + userId
                    });
                },
                /** 提交按钮 */
                submitForm: function() {
                    this.$refs['form'].validate(function(valid) {
                        if (valid) {
                            if (this.form.userId != undefined) {
                                ruoyi.put('/system/user', this.form, function(res) {
                                    this.$modal.msgSuccess('修改成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            } else {
                                ruoyi.post('/system/user', this.form, function(res) {
                                    this.$modal.msgSuccess('新增成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            }
                        }
                    }.bind(this));
                },
                /** 删除按钮操作 */
                handleDelete: function(row) {
                    var userIds = row.userId ? [row.userId] : this.ids;
                    this.$modal.confirm('是否确认删除用户编号为"' + userIds + '"的数据项？').then(function() {
                        ruoyi.del('/system/user/' + userIds.join(','), function(res) {
                            this.getList();
                            this.$modal.msgSuccess('删除成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 导出按钮操作 */
                handleExport: function() {
                    this.$modal.confirm('是否确认导出所有用户数据项？').then(function() {
                        var params = ruoyi.addDateRange(this.queryParams, this.dateRange);
                        ruoyi.download('/system/user/export', params, 'user_' + new Date().getTime() + '.xlsx');
                    }.bind(this)).catch(function() {});
                },
                /** 导入按钮操作 */
                handleImport: function() {
                    this.upload.title = '用户导入';
                    this.upload.open = true;
                },
                /** 下载模板操作 */
                importTemplate: function() {
                    ruoyi.downloadGet('/system/user/importTemplate', '用户导入模板.xlsx');
                },
                /** 文件上传中处理 */
                handleFileUploadProgress: function(event, file, fileList) {
                    this.upload.isUploading = true;
                },
                /** 文件上传成功处理 */
                handleFileSuccess: function(response, file, fileList) {
                    this.upload.open = false;
                    this.upload.isUploading = false;
                    this.$refs.upload.clearFiles();
                    this.$modal.alert(response.msg);
                    this.getList();
                },
                /** 提交上传文件 */
                submitFileForm: function() {
                    this.$refs.upload.submit();
                },
                /** 取消按钮 */
                cancel: function() {
                    this.open = false;
                    this.reset();
                },
                /** 表单重置 */
                reset: function() {
                    this.form = {
                        userId: undefined,
                        deptId: undefined,
                        userName: undefined,
                        nickName: undefined,
                        password: undefined,
                        phonenumber: undefined,
                        email: undefined,
                        sex: undefined,
                        status: '0',
                        remark: undefined,
                        postIds: [],
                        roleIds: []
                    };
                    this.deptSelectName = '';
                    if (this.$refs['form']) {
                        this.$refs['form'].resetFields();
                    }
                },
                /** 部门树节点选择 */
                handleDeptSelect: function(data) {
                    this.form.deptId = data.id;
                    this.deptSelectName = data.label;
                    if (this.$refs.deptPopover) {
                        this.$refs.deptPopover.doClose();
                    }
                },
                handleSizeChange: function(val) {
                    this.queryParams.pageSize = val;
                    this.getList();
                },
                handleCurrentChange: function(val) {
                    this.queryParams.pageNum = val;
                    this.getList();
                }
            },
            created: function() {
                this.getList();
                this.getDeptTree();
                ruoyi.loadDicts(this, ['sys_normal_disable', 'sys_user_sex']);
            }
        });
    </script>
</body>
</html>

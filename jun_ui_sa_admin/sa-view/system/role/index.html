<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>角色管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
    <link rel="stylesheet" href="../../static/ruoyi.css">
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="app-container">
            <!-- 搜索区域 -->
            <el-form :model="queryParams" ref="queryForm" :inline="true" label-width="68px">
                <el-form-item label="角色名称" prop="roleName">
                    <el-input v-model="queryParams.roleName" placeholder="请输入角色名称" clearable size="small" style="width: 240px"
                        @keyup.enter.native="handleQuery"></el-input>
                </el-form-item>
                <el-form-item label="权限字符" prop="roleKey">
                    <el-input v-model="queryParams.roleKey" placeholder="请输入权限字符" clearable size="small" style="width: 240px"
                        @keyup.enter.native="handleQuery"></el-input>
                </el-form-item>
                <el-form-item label="状态" prop="status">
                    <el-select v-model="queryParams.status" placeholder="角色状态" clearable size="small" style="width: 240px">
                        <el-option v-for="dict in statusOptions" :key="dict.value" :label="dict.label" :value="dict.value"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="创建时间">
                    <el-date-picker v-model="dateRange" size="small" style="width: 240px" value-format="yyyy-MM-dd"
                        type="daterange" range-separator="-" start-placeholder="开始日期" end-placeholder="结束日期"></el-date-picker>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" icon="el-icon-search" size="mini" @click="handleQuery">搜索</el-button>
                    <el-button icon="el-icon-refresh" size="mini" @click="resetQuery">重置</el-button>
                </el-form-item>
            </el-form>

            <!-- 操作按钮 -->
            <el-row :gutter="10" class="mb8">
                <el-col :span="1.5">
                    <el-button type="primary" plain icon="el-icon-plus" size="mini" @click="handleAdd"
                        v-hasPermi="['system:role:add']">新增</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="success" plain icon="el-icon-edit" size="mini" :disabled="single" @click="handleUpdate"
                        v-hasPermi="['system:role:edit']">修改</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="danger" plain icon="el-icon-delete" size="mini" :disabled="multiple" @click="handleDelete"
                        v-hasPermi="['system:role:remove']">删除</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="warning" plain icon="el-icon-download" size="mini" @click="handleExport"
                        v-hasPermi="['system:role:export']">导出</el-button>
                </el-col>
            </el-row>

            <!-- 数据表格 -->
            <el-table v-loading="loading" :data="roleList" @selection-change="handleSelectionChange">
                <el-table-column type="selection" width="55" align="center"></el-table-column>
                <el-table-column label="角色编号" prop="roleId" width="120" align="center"></el-table-column>
                <el-table-column label="角色名称" prop="roleName" :show-overflow-tooltip="true" width="150"></el-table-column>
                <el-table-column label="权限字符" prop="roleKey" :show-overflow-tooltip="true" width="150"></el-table-column>
                <el-table-column label="显示顺序" prop="roleSort" width="100" align="center"></el-table-column>
                <el-table-column label="状态" align="center" width="100">
                    <template slot-scope="scope">
                        <el-switch v-model="scope.row.status" active-value="0" inactive-value="1"
                            @change="handleStatusChange(scope.row)"></el-switch>
                    </template>
                </el-table-column>
                <el-table-column label="创建时间" align="center" prop="createTime" width="180">
                    <template slot-scope="scope">
                        <span>{{ parseTime(scope.row.createTime) }}</span>
                    </template>
                </el-table-column>
                <el-table-column label="操作" align="center" class-name="fixed-width">
                    <template slot-scope="scope">
                        <el-button size="mini" type="text" icon="el-icon-edit" @click="handleUpdate(scope.row)"
                            v-hasPermi="['system:role:edit']">修改</el-button>
                        <el-button size="mini" type="text" icon="el-icon-delete" @click="handleDelete(scope.row)"
                            v-hasPermi="['system:role:remove']">删除</el-button>
                        <el-dropdown size="mini" @command="function(command) { handleCommand(command, scope.row) }">
                            <el-button size="mini" type="text" icon="el-icon-d-arrow-right">更多</el-button>
                            <el-dropdown-menu slot="dropdown">
                                <el-dropdown-item command="handleDataScope" icon="el-icon-circle-check"
                                    v-hasPermi="['system:role:edit']">数据权限</el-dropdown-item>
                                <el-dropdown-item command="handleAuthUser" icon="el-icon-user"
                                    v-hasPermi="['system:role:edit']">分配用户</el-dropdown-item>
                            </el-dropdown-menu>
                        </el-dropdown>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <div class="pagination-container">
                <el-pagination background layout="total, sizes, prev, pager, next, jumper"
                    :current-page.sync="queryParams.pageNum" :page-sizes="[10, 20, 50, 100]"
                    :page-size.sync="queryParams.pageSize" :total="total"
                    @size-change="getList" @current-change="getList"></el-pagination>
            </div>

            <!-- 添加或修改角色对话框 -->
            <el-dialog :title="title" :visible.sync="open" width="500px" append-to-body>
                <el-form ref="form" :model="form" :rules="rules" label-width="100px">
                    <el-form-item label="角色名称" prop="roleName">
                        <el-input v-model="form.roleName" placeholder="请输入角色名称"></el-input>
                    </el-form-item>
                    <el-form-item prop="roleKey">
                        <span slot="label">
                            <el-tooltip content="控制器中定义的权限字符，如：@PreAuthorize(`@ss.hasRole('admin')`)" placement="top">
                                <i class="el-icon-question"></i>
                            </el-tooltip>
                            权限字符
                        </span>
                        <el-input v-model="form.roleKey" placeholder="请输入权限字符"></el-input>
                    </el-form-item>
                    <el-form-item label="角色顺序" prop="roleSort">
                        <el-input-number v-model="form.roleSort" controls-position="right" :min="0"></el-input-number>
                    </el-form-item>
                    <el-form-item label="状态">
                        <el-radio-group v-model="form.status">
                            <el-radio v-for="dict in statusOptions" :key="dict.value" :label="dict.value">{{dict.label}}</el-radio>
                        </el-radio-group>
                    </el-form-item>
                    <el-form-item label="菜单权限">
                        <el-checkbox v-model="menuExpand" @change="handleCheckedTreeExpand($event, 'menu')">展开/折叠</el-checkbox>
                        <el-checkbox v-model="menuNodeAll" @change="handleCheckedTreeNodeAll($event, 'menu')">全选/全不选</el-checkbox>
                        <el-checkbox v-model="form.menuCheckStrictly" @change="handleCheckedTreeConnect($event, 'menu')">父子联动</el-checkbox>
                        <el-tree class="tree-border" :data="menuOptions" show-checkbox ref="menu" node-key="id"
                            :check-strictly="!form.menuCheckStrictly" empty-text="加载中，请稍候"
                            :props="defaultProps"></el-tree>
                    </el-form-item>
                    <el-form-item label="备注">
                        <el-input v-model="form.remark" type="textarea" placeholder="请输入内容"></el-input>
                    </el-form-item>
                </el-form>
                <div slot="footer" class="dialog-footer">
                    <el-button type="primary" @click="submitForm">确 定</el-button>
                    <el-button @click="cancel">取 消</el-button>
                </div>
            </el-dialog>

            <!-- 分配数据权限对话框 -->
            <el-dialog :title="title" :visible.sync="openDataScope" width="500px" append-to-body>
                <el-form :model="form" label-width="80px">
                    <el-form-item label="角色名称">
                        <el-input v-model="form.roleName" :disabled="true"></el-input>
                    </el-form-item>
                    <el-form-item label="权限字符">
                        <el-input v-model="form.roleKey" :disabled="true"></el-input>
                    </el-form-item>
                    <el-form-item label="权限范围">
                        <el-select v-model="form.dataScope" @change="dataScopeSelectChange">
                            <el-option v-for="item in dataScopeOptions" :key="item.value" :label="item.label" :value="item.value"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="数据权限" v-show="form.dataScope == '2'">
                        <el-checkbox v-model="deptExpand" @change="handleCheckedTreeExpand($event, 'dept')">展开/折叠</el-checkbox>
                        <el-checkbox v-model="deptNodeAll" @change="handleCheckedTreeNodeAll($event, 'dept')">全选/全不选</el-checkbox>
                        <el-checkbox v-model="form.deptCheckStrictly" @change="handleCheckedTreeConnect($event, 'dept')">父子联动</el-checkbox>
                        <el-tree class="tree-border" :data="deptOptions" show-checkbox ref="dept" node-key="id"
                            :check-strictly="!form.deptCheckStrictly" empty-text="加载中，请稍候"
                            :props="defaultProps"></el-tree>
                    </el-form-item>
                </el-form>
                <div slot="footer" class="dialog-footer">
                    <el-button type="primary" @click="submitDataScope">确 定</el-button>
                    <el-button @click="cancelDataScope">取 消</el-button>
                </div>
            </el-dialog>
        </div>
    </div>
    <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/kj/layer/layer.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/ruoyi-util.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                // 遮罩层
                loading: true,
                // 选中数组
                ids: [],
                // 非单个禁用
                single: true,
                // 非多个禁用
                multiple: true,
                // 总条数
                total: 0,
                // 角色表格数据
                roleList: [],
                // 弹出层标题
                title: '',
                // 是否显示弹出层
                open: false,
                // 是否显示数据权限弹出层
                openDataScope: false,
                // 日期范围
                dateRange: [],
                // 状态数据字典
                statusOptions: [],
                // 数据范围选项
                dataScopeOptions: [
                    { value: '1', label: '全部数据权限' },
                    { value: '2', label: '自定数据权限' },
                    { value: '3', label: '本部门数据权限' },
                    { value: '4', label: '本部门及以下数据权限' },
                    { value: '5', label: '仅本人数据权限' }
                ],
                // 菜单列表
                menuOptions: [],
                // 部门列表
                deptOptions: [],
                // 查询参数
                queryParams: {
                    pageNum: 1,
                    pageSize: 10,
                    roleName: undefined,
                    roleKey: undefined,
                    status: undefined
                },
                // 表单参数
                form: {},
                // 表单默认值
                defaultProps: {
                    children: 'children',
                    label: 'label'
                },
                // 表单校验
                rules: {
                    roleName: [
                        { required: true, message: '角色名称不能为空', trigger: 'blur' }
                    ],
                    roleKey: [
                        { required: true, message: '权限字符不能为空', trigger: 'blur' }
                    ],
                    roleSort: [
                        { required: true, message: '角色顺序不能为空', trigger: 'blur' }
                    ]
                },
                // 菜单树选项
                menuExpand: false,
                menuNodeAll: false,
                // 部门树选项
                deptExpand: true,
                deptNodeAll: false
            },
            methods: {
                /** 查询角色列表 */
                getList: function() {
                    this.loading = true;
                    var params = ruoyi.addDateRange(this.queryParams, this.dateRange);
                    ruoyi.get('/system/role/list', params, function(res) {
                        this.roleList = res.rows;
                        this.total = res.total;
                        this.loading = false;
                    }.bind(this));
                },
                /** 搜索按钮操作 */
                handleQuery: function() {
                    this.queryParams.pageNum = 1;
                    this.getList();
                },
                /** 重置按钮操作 */
                resetQuery: function() {
                    this.dateRange = [];
                    this.resetForm('queryForm');
                    this.handleQuery();
                },
                /** 多选框选中数据 */
                handleSelectionChange: function(selection) {
                    this.ids = selection.map(function(item) { return item.roleId; });
                    this.single = selection.length !== 1;
                    this.multiple = !selection.length;
                },
                /** 更多操作触发 */
                handleCommand: function(command, row) {
                    switch (command) {
                        case 'handleDataScope':
                            this.handleDataScope(row);
                            break;
                        case 'handleAuthUser':
                            this.handleAuthUser(row);
                            break;
                        default:
                            break;
                    }
                },
                /** 角色状态修改 */
                handleStatusChange: function(row) {
                    var text = row.status === '0' ? '启用' : '停用';
                    this.$modal.confirm('确认要"' + text + '""' + row.roleName + '"角色吗？').then(function() {
                        ruoyi.put('/system/role/changeStatus', {
                            roleId: row.roleId,
                            status: row.status
                        }, function(res) {
                            this.$modal.msgSuccess(text + '成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {
                        row.status = row.status === '0' ? '1' : '0';
                    });
                },
                /** 分配用户操作 */
                handleAuthUser: function(row) {
                    parent.sa_admin.showTab({
                        id: 'role-auth-user-' + row.roleId,
                        name: '分配用户',
                        url: 'sa-view/system/role/authUser.html?roleId=' + row.roleId
                    });
                },
                /** 查询菜单树结构 */
                getMenuTreeselect: function() {
                    ruoyi.get('/system/menu/treeselect', function(res) {
                        this.menuOptions = res.data;
                    }.bind(this));
                },
                /** 根据角色ID查询菜单树结构 */
                getRoleMenuTreeselect: function(roleId) {
                    ruoyi.get('/system/menu/roleMenuTreeselect/' + roleId, function(res) {
                        this.menuOptions = res.menus;
                        this.$nextTick(function() {
                            var checkedKeys = res.checkedKeys;
                            checkedKeys.forEach(function(v) {
                                this.$refs.menu.setChecked(v, true, false);
                            }.bind(this));
                        });
                    }.bind(this));
                },
                /** 根据角色ID查询部门树结构 */
                getRoleDeptTreeselect: function(roleId) {
                    ruoyi.get('/system/dept/roleDeptTreeselect/' + roleId, function(res) {
                        this.deptOptions = res.depts;
                        this.$nextTick(function() {
                            var checkedKeys = res.checkedKeys;
                            checkedKeys.forEach(function(v) {
                                this.$refs.dept.setChecked(v, true, false);
                            }.bind(this));
                        });
                    }.bind(this));
                },
                /** 树权限（展开/折叠）*/
                handleCheckedTreeExpand: function(value, type) {
                    var treeList = type === 'menu' ? this.menuOptions : this.deptOptions;
                    var treeRef = this.$refs[type];
                    var allNodes = [];
                    function getAllNodes(nodes) {
                        for (var i = 0; i < nodes.length; i++) {
                            allNodes.push(nodes[i]);
                            if (nodes[i].children) {
                                getAllNodes(nodes[i].children);
                            }
                        }
                    }
                    getAllNodes(treeList);
                    for (var i = 0; i < allNodes.length; i++) {
                        var node = treeRef.store.nodesMap[allNodes[i].id];
                        if (node) {
                            node.expanded = value;
                        }
                    }
                },
                /** 树权限（全选/全不选） */
                handleCheckedTreeNodeAll: function(value, type) {
                    var treeRef = this.$refs[type];
                    if (value) {
                        treeRef.setCheckedNodes(type === 'menu' ? this.menuOptions : this.deptOptions);
                    } else {
                        treeRef.setCheckedKeys([]);
                    }
                },
                /** 树权限（父子联动） */
                handleCheckedTreeConnect: function(value, type) {
                    if (type === 'menu') {
                        this.form.menuCheckStrictly = value;
                    } else {
                        this.form.deptCheckStrictly = value;
                    }
                },
                /** 所有菜单节点数据 */
                getMenuAllCheckedKeys: function() {
                    var checkedKeys = this.$refs.menu.getCheckedKeys();
                    var halfCheckedKeys = this.$refs.menu.getHalfCheckedKeys();
                    checkedKeys.unshift.apply(checkedKeys, halfCheckedKeys);
                    return checkedKeys;
                },
                /** 所有部门节点数据 */
                getDeptAllCheckedKeys: function() {
                    var checkedKeys = this.$refs.dept.getCheckedKeys();
                    var halfCheckedKeys = this.$refs.dept.getHalfCheckedKeys();
                    checkedKeys.unshift.apply(checkedKeys, halfCheckedKeys);
                    return checkedKeys;
                },
                /** 重置新增的表单以及其他数据 */
                reset: function() {
                    if (this.$refs.menu !== undefined) {
                        this.$refs.menu.setCheckedKeys([]);
                    }
                    this.menuExpand = false;
                    this.menuNodeAll = false;
                    this.deptExpand = true;
                    this.deptNodeAll = false;
                    this.form = {
                        roleId: undefined,
                        roleName: undefined,
                        roleKey: undefined,
                        roleSort: 0,
                        status: '0',
                        menuIds: [],
                        deptIds: [],
                        menuCheckStrictly: true,
                        deptCheckStrictly: true,
                        remark: undefined
                    };
                    this.resetForm('form');
                },
                /** 新增按钮操作 */
                handleAdd: function() {
                    this.reset();
                    this.getMenuTreeselect();
                    this.open = true;
                    this.title = '添加角色';
                },
                /** 修改按钮操作 */
                handleUpdate: function(row) {
                    this.reset();
                    var roleId = row.roleId || this.ids[0];
                    this.$nextTick(function() {
                        this.getRoleMenuTreeselect(roleId);
                    });
                    ruoyi.get('/system/role/' + roleId, function(res) {
                        this.form = res.data;
                        this.open = true;
                        this.title = '修改角色';
                    }.bind(this));
                },
                /** 数据权限操作 */
                handleDataScope: function(row) {
                    this.reset();
                    ruoyi.get('/system/role/' + row.roleId, function(res) {
                        this.form = res.data;
                        this.openDataScope = true;
                        this.title = '分配数据权限';
                        this.$nextTick(function() {
                            this.getRoleDeptTreeselect(row.roleId);
                        });
                    }.bind(this));
                },
                /** 数据范围选项变化 */
                dataScopeSelectChange: function(value) {
                    if (value !== '2') {
                        this.$refs.dept && this.$refs.dept.setCheckedKeys([]);
                    }
                },
                /** 提交按钮 */
                submitForm: function() {
                    this.$refs['form'].validate(function(valid) {
                        if (valid) {
                            this.form.menuIds = this.getMenuAllCheckedKeys();
                            if (this.form.roleId !== undefined) {
                                ruoyi.put('/system/role', this.form, function(res) {
                                    this.$modal.msgSuccess('修改成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            } else {
                                ruoyi.post('/system/role', this.form, function(res) {
                                    this.$modal.msgSuccess('新增成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            }
                        }
                    }.bind(this));
                },
                /** 提交数据权限按钮 */
                submitDataScope: function() {
                    if (this.form.roleId !== undefined) {
                        this.form.deptIds = this.getDeptAllCheckedKeys();
                        ruoyi.put('/system/role/dataScope', this.form, function(res) {
                            this.$modal.msgSuccess('修改成功');
                            this.openDataScope = false;
                            this.getList();
                        }.bind(this));
                    }
                },
                /** 取消按钮 */
                cancel: function() {
                    this.open = false;
                    this.reset();
                },
                /** 取消数据权限按钮 */
                cancelDataScope: function() {
                    this.openDataScope = false;
                    this.reset();
                },
                /** 删除按钮操作 */
                handleDelete: function(row) {
                    var roleIds = row.roleId ? [row.roleId] : this.ids;
                    this.$modal.confirm('是否确认删除角色编号为"' + roleIds + '"的数据项？').then(function() {
                        ruoyi.del('/system/role/' + roleIds, function(res) {
                            this.getList();
                            this.$modal.msgSuccess('删除成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 导出按钮操作 */
                handleExport: function() {
                    this.$modal.confirm('是否确认导出所有角色数据项？').then(function() {
                        ruoyi.download('/system/role/export', this.queryParams, '角色数据.xlsx');
                    }.bind(this)).catch(function() {});
                }
            },
            created: function() {
                this.getList();
                ruoyi.loadDicts(this, ['sys_normal_disable']);
                this.$nextTick(function() {
                    this.statusOptions = this.sysNormalDisableOptions;
                });
                ruoyi.getDicts('sys_normal_disable', function(data) {
                    this.statusOptions = data;
                }.bind(this));
            }
        });
    </script>
</body>
</html>

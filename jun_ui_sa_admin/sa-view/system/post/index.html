<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>岗位管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
    <link rel="stylesheet" href="../../static/ruoyi.css">
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="app-container">
            <!-- 搜索区域 -->
            <el-form :model="queryParams" ref="queryForm" :inline="true" label-width="68px">
                <el-form-item label="岗位编码" prop="postCode">
                    <el-input v-model="queryParams.postCode" placeholder="请输入岗位编码" clearable size="small" style="width: 240px"
                        @keyup.enter.native="handleQuery"></el-input>
                </el-form-item>
                <el-form-item label="岗位名称" prop="postName">
                    <el-input v-model="queryParams.postName" placeholder="请输入岗位名称" clearable size="small" style="width: 240px"
                        @keyup.enter.native="handleQuery"></el-input>
                </el-form-item>
                <el-form-item label="状态" prop="status">
                    <el-select v-model="queryParams.status" placeholder="岗位状态" clearable size="small" style="width: 240px">
                        <el-option v-for="dict in statusOptions" :key="dict.value" :label="dict.label" :value="dict.value"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" icon="el-icon-search" size="mini" @click="handleQuery">搜索</el-button>
                    <el-button icon="el-icon-refresh" size="mini" @click="resetQuery">重置</el-button>
                </el-form-item>
            </el-form>

            <!-- 操作按钮 -->
            <el-row :gutter="10" class="mb8">
                <el-col :span="1.5">
                    <el-button type="primary" plain icon="el-icon-plus" size="mini" @click="handleAdd"
                        v-hasPermi="['system:post:add']">新增</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="success" plain icon="el-icon-edit" size="mini" :disabled="single" @click="handleUpdate"
                        v-hasPermi="['system:post:edit']">修改</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="danger" plain icon="el-icon-delete" size="mini" :disabled="multiple" @click="handleDelete"
                        v-hasPermi="['system:post:remove']">删除</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="warning" plain icon="el-icon-download" size="mini" @click="handleExport"
                        v-hasPermi="['system:post:export']">导出</el-button>
                </el-col>
            </el-row>

            <!-- 数据表格 -->
            <el-table v-loading="loading" :data="postList" @selection-change="handleSelectionChange">
                <el-table-column type="selection" width="55" align="center"></el-table-column>
                <el-table-column label="岗位编号" align="center" prop="postId" width="100"></el-table-column>
                <el-table-column label="岗位编码" align="center" prop="postCode"></el-table-column>
                <el-table-column label="岗位名称" align="center" prop="postName"></el-table-column>
                <el-table-column label="岗位排序" align="center" prop="postSort" width="100"></el-table-column>
                <el-table-column label="状态" align="center" prop="status" width="100">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.status === '0' ? '' : 'danger'" size="small">
                            {{ selectDictLabel(statusOptions, scope.row.status) }}
                        </el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="创建时间" align="center" prop="createTime" width="180">
                    <template slot-scope="scope">
                        <span>{{ parseTime(scope.row.createTime) }}</span>
                    </template>
                </el-table-column>
                <el-table-column label="操作" align="center" class-name="fixed-width" width="180">
                    <template slot-scope="scope">
                        <el-button size="mini" type="text" icon="el-icon-edit" @click="handleUpdate(scope.row)"
                            v-hasPermi="['system:post:edit']">修改</el-button>
                        <el-button size="mini" type="text" icon="el-icon-delete" @click="handleDelete(scope.row)"
                            v-hasPermi="['system:post:remove']">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <div class="pagination-container">
                <el-pagination background layout="total, sizes, prev, pager, next, jumper"
                    :current-page.sync="queryParams.pageNum" :page-sizes="[10, 20, 50, 100]"
                    :page-size.sync="queryParams.pageSize" :total="total"
                    @size-change="getList" @current-change="getList"></el-pagination>
            </div>

            <!-- 添加或修改岗位对话框 -->
            <el-dialog :title="title" :visible.sync="open" width="500px" append-to-body>
                <el-form ref="form" :model="form" :rules="rules" label-width="80px">
                    <el-form-item label="岗位名称" prop="postName">
                        <el-input v-model="form.postName" placeholder="请输入岗位名称"></el-input>
                    </el-form-item>
                    <el-form-item label="岗位编码" prop="postCode">
                        <el-input v-model="form.postCode" placeholder="请输入岗位编码"></el-input>
                    </el-form-item>
                    <el-form-item label="岗位顺序" prop="postSort">
                        <el-input-number v-model="form.postSort" controls-position="right" :min="0"></el-input-number>
                    </el-form-item>
                    <el-form-item label="岗位状态" prop="status">
                        <el-radio-group v-model="form.status">
                            <el-radio v-for="dict in statusOptions" :key="dict.value" :label="dict.value">{{dict.label}}</el-radio>
                        </el-radio-group>
                    </el-form-item>
                    <el-form-item label="备注" prop="remark">
                        <el-input v-model="form.remark" type="textarea" placeholder="请输入内容"></el-input>
                    </el-form-item>
                </el-form>
                <div slot="footer" class="dialog-footer">
                    <el-button type="primary" @click="submitForm">确 定</el-button>
                    <el-button @click="cancel">取 消</el-button>
                </div>
            </el-dialog>
        </div>
    </div>
    <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/kj/layer/layer.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/ruoyi-util.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                // 遮罩层
                loading: true,
                // 选中数组
                ids: [],
                // 非单个禁用
                single: true,
                // 非多个禁用
                multiple: true,
                // 总条数
                total: 0,
                // 岗位表格数据
                postList: [],
                // 弹出层标题
                title: '',
                // 是否显示弹出层
                open: false,
                // 状态数据字典
                statusOptions: [],
                // 查询参数
                queryParams: {
                    pageNum: 1,
                    pageSize: 10,
                    postCode: undefined,
                    postName: undefined,
                    status: undefined
                },
                // 表单参数
                form: {},
                // 表单校验
                rules: {
                    postName: [
                        { required: true, message: '岗位名称不能为空', trigger: 'blur' }
                    ],
                    postCode: [
                        { required: true, message: '岗位编码不能为空', trigger: 'blur' }
                    ],
                    postSort: [
                        { required: true, message: '岗位顺序不能为空', trigger: 'blur' }
                    ]
                }
            },
            methods: {
                /** 查询岗位列表 */
                getList: function() {
                    this.loading = true;
                    ruoyi.get('/system/post/list', this.queryParams, function(res) {
                        this.postList = res.rows;
                        this.total = res.total;
                        this.loading = false;
                    }.bind(this));
                },
                /** 搜索按钮操作 */
                handleQuery: function() {
                    this.queryParams.pageNum = 1;
                    this.getList();
                },
                /** 重置按钮操作 */
                resetQuery: function() {
                    this.resetForm('queryForm');
                    this.handleQuery();
                },
                /** 多选框选中数据 */
                handleSelectionChange: function(selection) {
                    this.ids = selection.map(function(item) { return item.postId; });
                    this.single = selection.length !== 1;
                    this.multiple = !selection.length;
                },
                /** 表单重置 */
                reset: function() {
                    this.form = {
                        postId: undefined,
                        postCode: undefined,
                        postName: undefined,
                        postSort: 0,
                        status: '0',
                        remark: undefined
                    };
                    this.resetForm('form');
                },
                /** 新增按钮操作 */
                handleAdd: function() {
                    this.reset();
                    this.open = true;
                    this.title = '添加岗位';
                },
                /** 修改按钮操作 */
                handleUpdate: function(row) {
                    this.reset();
                    var postId = row.postId || this.ids[0];
                    ruoyi.get('/system/post/' + postId, function(res) {
                        this.form = res.data;
                        this.open = true;
                        this.title = '修改岗位';
                    }.bind(this));
                },
                /** 提交按钮 */
                submitForm: function() {
                    this.$refs['form'].validate(function(valid) {
                        if (valid) {
                            if (this.form.postId !== undefined) {
                                ruoyi.put('/system/post', this.form, function(res) {
                                    this.$modal.msgSuccess('修改成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            } else {
                                ruoyi.post('/system/post', this.form, function(res) {
                                    this.$modal.msgSuccess('新增成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            }
                        }
                    }.bind(this));
                },
                /** 取消按钮 */
                cancel: function() {
                    this.open = false;
                    this.reset();
                },
                /** 删除按钮操作 */
                handleDelete: function(row) {
                    var postIds = row.postId ? [row.postId] : this.ids;
                    this.$modal.confirm('是否确认删除岗位编号为"' + postIds + '"的数据项？').then(function() {
                        ruoyi.del('/system/post/' + postIds, function(res) {
                            this.getList();
                            this.$modal.msgSuccess('删除成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 导出按钮操作 */
                handleExport: function() {
                    this.$modal.confirm('是否确认导出所有岗位数据项？').then(function() {
                        ruoyi.download('/system/post/export', this.queryParams, '岗位数据.xlsx');
                    }.bind(this)).catch(function() {});
                }
            },
            created: function() {
                this.getList();
                ruoyi.getDicts('sys_normal_disable', function(data) {
                    this.statusOptions = data;
                }.bind(this));
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>字典数据</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
    <link rel="stylesheet" href="../../static/ruoyi.css">
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="c-panel">
            <!-- 检索参数 -->
            <div class="c-title">字典数据 【{{ dictType }}】</div>
            <el-form :inline="true" :model="queryParams" ref="queryForm" @submit.native.prevent>
                <el-form-item label="字典标签" prop="dictLabel">
                    <el-input v-model="queryParams.dictLabel" placeholder="请输入字典标签" clearable size="small" style="width: 200px;" @keyup.enter.native="handleQuery"></el-input>
                </el-form-item>
                <el-form-item label="状态" prop="status">
                    <el-select v-model="queryParams.status" placeholder="数据状态" clearable size="small" style="width: 200px;">
                        <el-option v-for="dict in sysNormalDisableOptions" :key="dict.value" :label="dict.label" :value="dict.value"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" icon="el-icon-search" size="mini" @click="handleQuery">搜索</el-button>
                    <el-button icon="el-icon-refresh" size="mini" @click="resetQuery">重置</el-button>
                </el-form-item>
            </el-form>

            <!-- 操作按钮 -->
            <el-row :gutter="10" class="mb8">
                <el-col :span="1.5">
                    <el-button type="primary" plain icon="el-icon-plus" size="mini" @click="handleAdd" v-hasPermi="['system:dict:add']">新增</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="success" plain icon="el-icon-edit" size="mini" :disabled="single" @click="handleUpdate" v-hasPermi="['system:dict:edit']">修改</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="danger" plain icon="el-icon-delete" size="mini" :disabled="multiple" @click="handleDelete" v-hasPermi="['system:dict:remove']">删除</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="warning" plain icon="el-icon-download" size="mini" @click="handleExport" v-hasPermi="['system:dict:export']">导出</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="warning" plain icon="el-icon-close" size="mini" @click="handleClose">关闭</el-button>
                </el-col>
            </el-row>

            <!-- 数据列表 -->
            <el-table :data="dataList" size="small" @selection-change="handleSelectionChange" v-loading="loading">
                <el-table-column type="selection" width="55" align="center"></el-table-column>
                <el-table-column label="字典编码" align="center" prop="dictCode" width="100"></el-table-column>
                <el-table-column label="字典标签" align="center" prop="dictLabel">
                    <template slot-scope="scope">
                        <span v-if="scope.row.listClass === '' || scope.row.listClass === 'default'">{{ scope.row.dictLabel }}</span>
                        <el-tag v-else :type="scope.row.listClass === 'primary' ? '' : scope.row.listClass" size="small">{{ scope.row.dictLabel }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="字典键值" align="center" prop="dictValue"></el-table-column>
                <el-table-column label="字典排序" align="center" prop="dictSort" width="100"></el-table-column>
                <el-table-column label="状态" align="center" prop="status" width="100">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.status === '0' ? 'success' : 'danger'" size="small">{{ selectDictLabel(sysNormalDisableOptions, scope.row.status) }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="备注" align="center" prop="remark" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="创建时间" align="center" prop="createTime" width="180">
                    <template slot-scope="scope">
                        <span>{{ parseTime(scope.row.createTime) }}</span>
                    </template>
                </el-table-column>
                <el-table-column label="操作" align="center" class-name="fixed-width" width="200">
                    <template slot-scope="scope">
                        <el-button size="mini" type="text" icon="el-icon-edit" @click="handleUpdate(scope.row)" v-hasPermi="['system:dict:edit']">修改</el-button>
                        <el-button size="mini" type="text" icon="el-icon-delete" @click="handleDelete(scope.row)" v-hasPermi="['system:dict:remove']">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <div class="pagination-container">
                <el-pagination background layout="total, sizes, prev, pager, next, jumper" :current-page.sync="queryParams.pageNum" :page-size.sync="queryParams.pageSize" :page-sizes="[10, 20, 50, 100]" :total="total" @size-change="getList" @current-change="getList"></el-pagination>
            </div>
        </div>

        <!-- 添加或修改字典数据对话框 -->
        <el-dialog :title="title" :visible.sync="open" width="500px" append-to-body>
            <el-form ref="form" :model="form" :rules="rules" label-width="100px">
                <el-form-item label="字典类型">
                    <el-input v-model="form.dictType" :disabled="true"></el-input>
                </el-form-item>
                <el-form-item label="数据标签" prop="dictLabel">
                    <el-input v-model="form.dictLabel" placeholder="请输入数据标签"></el-input>
                </el-form-item>
                <el-form-item label="数据键值" prop="dictValue">
                    <el-input v-model="form.dictValue" placeholder="请输入数据键值"></el-input>
                </el-form-item>
                <el-form-item label="样式属性" prop="cssClass">
                    <el-input v-model="form.cssClass" placeholder="请输入样式属性"></el-input>
                </el-form-item>
                <el-form-item label="显示排序" prop="dictSort">
                    <el-input-number v-model="form.dictSort" controls-position="right" :min="0"></el-input-number>
                </el-form-item>
                <el-form-item label="回显样式" prop="listClass">
                    <el-select v-model="form.listClass" placeholder="请选择回显样式">
                        <el-option label="默认(default)" value="default"></el-option>
                        <el-option label="主要(primary)" value="primary"></el-option>
                        <el-option label="成功(success)" value="success"></el-option>
                        <el-option label="信息(info)" value="info"></el-option>
                        <el-option label="警告(warning)" value="warning"></el-option>
                        <el-option label="危险(danger)" value="danger"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="状态" prop="status">
                    <el-radio-group v-model="form.status">
                        <el-radio v-for="dict in sysNormalDisableOptions" :key="dict.value" :label="dict.value">{{ dict.label }}</el-radio>
                    </el-radio-group>
                </el-form-item>
                <el-form-item label="备注" prop="remark">
                    <el-input v-model="form.remark" type="textarea" placeholder="请输入内容"></el-input>
                </el-form-item>
            </el-form>
            <div slot="footer" class="dialog-footer">
                <el-button type="primary" @click="submitForm">确 定</el-button>
                <el-button @click="cancel">取 消</el-button>
            </div>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/kj/layer/layer.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/ruoyi-util.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                // 遮罩层
                loading: true,
                // 选中数组
                ids: [],
                // 非单个禁用
                single: true,
                // 非多个禁用
                multiple: true,
                // 总条数
                total: 0,
                // 字典数据表格数据
                dataList: [],
                // 弹出层标题
                title: '',
                // 是否显示弹出层
                open: false,
                // 字典类型
                dictType: '',
                // 字典ID
                dictId: '',
                // 字典状态选项
                sysNormalDisableOptions: [],
                // 查询参数
                queryParams: {
                    pageNum: 1,
                    pageSize: 10,
                    dictType: undefined,
                    dictLabel: undefined,
                    status: undefined
                },
                // 表单参数
                form: {},
                // 表单校验
                rules: {
                    dictLabel: [
                        { required: true, message: '数据标签不能为空', trigger: 'blur' }
                    ],
                    dictValue: [
                        { required: true, message: '数据键值不能为空', trigger: 'blur' }
                    ],
                    dictSort: [
                        { required: true, message: '数据顺序不能为空', trigger: 'blur' }
                    ]
                }
            },
            methods: {
                /** 查询字典数据列表 */
                getList: function() {
                    this.loading = true;
                    ruoyi.get('/system/dict/data/list', this.queryParams, function(res) {
                        this.dataList = res.rows;
                        this.total = res.total;
                        this.loading = false;
                    }.bind(this));
                },
                /** 搜索按钮操作 */
                handleQuery: function() {
                    this.queryParams.pageNum = 1;
                    this.getList();
                },
                /** 重置按钮操作 */
                resetQuery: function() {
                    this.resetForm('queryForm');
                    this.queryParams.pageNum = 1;
                    this.queryParams.dictLabel = undefined;
                    this.queryParams.status = undefined;
                    this.handleQuery();
                },
                /** 多选框选中数据 */
                handleSelectionChange: function(selection) {
                    this.ids = selection.map(function(item) { return item.dictCode; });
                    this.single = selection.length !== 1;
                    this.multiple = !selection.length;
                },
                /** 新增按钮操作 */
                handleAdd: function() {
                    this.reset();
                    this.open = true;
                    this.title = '添加字典数据';
                    this.form.dictType = this.dictType;
                },
                /** 修改按钮操作 */
                handleUpdate: function(row) {
                    this.reset();
                    var dictCode = row.dictCode || this.ids[0];
                    ruoyi.get('/system/dict/data/' + dictCode, function(res) {
                        this.form = res.data;
                        this.open = true;
                        this.title = '修改字典数据';
                    }.bind(this));
                },
                /** 提交按钮 */
                submitForm: function() {
                    this.$refs['form'].validate(function(valid) {
                        if (valid) {
                            if (this.form.dictCode !== undefined) {
                                ruoyi.put('/system/dict/data', this.form, function(res) {
                                    this.$modal.msgSuccess('修改成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            } else {
                                ruoyi.post('/system/dict/data', this.form, function(res) {
                                    this.$modal.msgSuccess('新增成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            }
                        }
                    }.bind(this));
                },
                /** 删除按钮操作 */
                handleDelete: function(row) {
                    var dictCodes = row.dictCode ? [row.dictCode] : this.ids;
                    this.$modal.confirm('是否确认删除字典编码为"' + dictCodes + '"的数据项？').then(function() {
                        ruoyi.del('/system/dict/data/' + dictCodes.join(','), function(res) {
                            this.getList();
                            this.$modal.msgSuccess('删除成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 导出按钮操作 */
                handleExport: function() {
                    this.$modal.confirm('是否确认导出所有字典数据项？').then(function() {
                        ruoyi.download('/system/dict/data/export', this.queryParams, 'dict_data.xlsx');
                    }.bind(this)).catch(function() {});
                },
                /** 关闭按钮 */
                handleClose: function() {
                    var tabId = 'dict-data-' + this.dictId;
                    if (parent.sa_admin) {
                        parent.sa_admin.closeTabById(tabId);
                    }
                },
                /** 取消按钮 */
                cancel: function() {
                    this.open = false;
                    this.reset();
                },
                /** 表单重置 */
                reset: function() {
                    this.form = {
                        dictCode: undefined,
                        dictType: undefined,
                        dictLabel: undefined,
                        dictValue: undefined,
                        cssClass: undefined,
                        dictSort: 0,
                        listClass: 'default',
                        status: '0',
                        remark: undefined
                    };
                    if (this.$refs['form']) {
                        this.$refs['form'].resetFields();
                    }
                }
            },
            created: function() {
                this.dictId = ruoyi.getQueryParam('dictId') || '';
                this.dictType = ruoyi.getQueryParam('dictType') || '';
                this.queryParams.dictType = this.dictType;
                this.getList();
                ruoyi.loadDicts(this, ['sys_normal_disable']);
            }
        });
    </script>
</body>
</html>

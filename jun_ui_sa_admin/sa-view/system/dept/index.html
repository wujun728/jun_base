<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>部门管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
    <link rel="stylesheet" href="../../static/ruoyi.css">
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="app-container">
            <!-- 搜索区域 -->
            <el-form :model="queryParams" ref="queryForm" :inline="true" label-width="68px">
                <el-form-item label="部门名称" prop="deptName">
                    <el-input v-model="queryParams.deptName" placeholder="请输入部门名称" clearable size="small" style="width: 240px"
                        @keyup.enter.native="handleQuery"></el-input>
                </el-form-item>
                <el-form-item label="状态" prop="status">
                    <el-select v-model="queryParams.status" placeholder="部门状态" clearable size="small" style="width: 240px">
                        <el-option v-for="dict in statusOptions" :key="dict.value" :label="dict.label" :value="dict.value"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" icon="el-icon-search" size="mini" @click="handleQuery">搜索</el-button>
                    <el-button icon="el-icon-refresh" size="mini" @click="resetQuery">重置</el-button>
                </el-form-item>
            </el-form>

            <!-- 操作按钮 -->
            <el-row :gutter="10" class="mb8">
                <el-col :span="1.5">
                    <el-button type="primary" plain icon="el-icon-plus" size="mini" @click="handleAdd"
                        v-hasPermi="['system:dept:add']">新增</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="info" plain icon="el-icon-sort" size="mini" @click="toggleExpandAll">展开/折叠</el-button>
                </el-col>
            </el-row>

            <!-- 部门树表格 -->
            <el-table v-if="refreshTable" v-loading="loading" :data="deptList" row-key="deptId"
                :tree-props="{children: 'children', hasChildren: 'hasChildren'}" :default-expand-all="isExpandAll">
                <el-table-column prop="deptName" label="部门名称" width="260"></el-table-column>
                <el-table-column prop="orderNum" label="排序" width="200" align="center"></el-table-column>
                <el-table-column prop="status" label="状态" width="100" align="center">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.status === '0' ? '' : 'danger'" size="small">
                            {{ selectDictLabel(statusOptions, scope.row.status) }}
                        </el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="创建时间" align="center" prop="createTime" width="200">
                    <template slot-scope="scope">
                        <span>{{ parseTime(scope.row.createTime) }}</span>
                    </template>
                </el-table-column>
                <el-table-column label="操作" align="center" class-name="fixed-width">
                    <template slot-scope="scope">
                        <el-button size="mini" type="text" icon="el-icon-edit" @click="handleUpdate(scope.row)"
                            v-hasPermi="['system:dept:edit']">修改</el-button>
                        <el-button size="mini" type="text" icon="el-icon-plus" @click="handleAdd(scope.row)"
                            v-hasPermi="['system:dept:add']">新增</el-button>
                        <el-button v-if="scope.row.parentId !== 0" size="mini" type="text" icon="el-icon-delete" @click="handleDelete(scope.row)"
                            v-hasPermi="['system:dept:remove']">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 添加或修改部门对话框 -->
            <el-dialog :title="title" :visible.sync="open" width="600px" append-to-body>
                <el-form ref="form" :model="form" :rules="rules" label-width="80px">
                    <el-row>
                        <el-col :span="24" v-if="form.parentId !== 0">
                            <el-form-item label="上级部门" prop="parentId">
                                <el-cascader v-model="form.parentId" :options="deptTreeOptions"
                                    :props="{ checkStrictly: true, value: 'deptId', label: 'deptName', children: 'children', emitPath: false }"
                                    clearable placeholder="选择上级部门" style="width: 100%">
                                </el-cascader>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="部门名称" prop="deptName">
                                <el-input v-model="form.deptName" placeholder="请输入部门名称"></el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="显示排序" prop="orderNum">
                                <el-input-number v-model="form.orderNum" controls-position="right" :min="0"></el-input-number>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="负责人" prop="leader">
                                <el-input v-model="form.leader" placeholder="请输入负责人" maxlength="20"></el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="联系电话" prop="phone">
                                <el-input v-model="form.phone" placeholder="请输入联系电话" maxlength="11"></el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="邮箱" prop="email">
                                <el-input v-model="form.email" placeholder="请输入邮箱" maxlength="50"></el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="部门状态">
                                <el-radio-group v-model="form.status">
                                    <el-radio v-for="dict in statusOptions" :key="dict.value" :label="dict.value">{{dict.label}}</el-radio>
                                </el-radio-group>
                            </el-form-item>
                        </el-col>
                    </el-row>
                </el-form>
                <div slot="footer" class="dialog-footer">
                    <el-button type="primary" @click="submitForm">确 定</el-button>
                    <el-button @click="cancel">取 消</el-button>
                </div>
            </el-dialog>
        </div>
    </div>
    <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/kj/layer/layer.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/ruoyi-util.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                // 遮罩层
                loading: true,
                // 部门表格树数据
                deptList: [],
                // 部门树选项（用于对话框中的上级部门选择）
                deptTreeOptions: [],
                // 弹出层标题
                title: '',
                // 是否显示弹出层
                open: false,
                // 是否展开，默认全部展开
                isExpandAll: true,
                // 重新渲染表格状态
                refreshTable: true,
                // 状态数据字典
                statusOptions: [],
                // 查询参数
                queryParams: {
                    deptName: undefined,
                    status: undefined
                },
                // 表单参数
                form: {},
                // 表单校验
                rules: {
                    parentId: [
                        { required: true, message: '上级部门不能为空', trigger: 'blur' }
                    ],
                    deptName: [
                        { required: true, message: '部门名称不能为空', trigger: 'blur' }
                    ],
                    orderNum: [
                        { required: true, message: '显示排序不能为空', trigger: 'blur' }
                    ],
                    email: [
                        { type: 'email', message: '请输入正确的邮箱地址', trigger: ['blur', 'change'] }
                    ],
                    phone: [
                        { pattern: /^1[3|4|5|6|7|8|9][0-9]\d{8}$/, message: '请输入正确的手机号码', trigger: 'blur' }
                    ]
                }
            },
            methods: {
                /** 查询部门列表 */
                getList: function() {
                    this.loading = true;
                    ruoyi.get('/system/dept/list', this.queryParams, function(res) {
                        this.deptList = ruoyi.handleTree(res.data, 'deptId');
                        this.loading = false;
                    }.bind(this));
                },
                /** 查询部门下拉树结构（新增时用完整列表） */
                getTreeselect: function() {
                    ruoyi.get('/system/dept/list', function(res) {
                        var depts = [{ deptId: 0, deptName: '主类目', children: [] }];
                        depts[0].children = ruoyi.handleTree(res.data, 'deptId');
                        this.deptTreeOptions = depts;
                    }.bind(this));
                },
                /** 查询部门下拉树结构（编辑时排除自身及下级） */
                getTreeselectExclude: function(deptId) {
                    ruoyi.get('/system/dept/list/exclude/' + deptId, function(res) {
                        var depts = [{ deptId: 0, deptName: '主类目', children: [] }];
                        depts[0].children = ruoyi.handleTree(res.data, 'deptId');
                        this.deptTreeOptions = depts;
                    }.bind(this));
                },
                /** 搜索按钮操作 */
                handleQuery: function() {
                    this.getList();
                },
                /** 重置按钮操作 */
                resetQuery: function() {
                    this.resetForm('queryForm');
                    this.handleQuery();
                },
                /** 展开/折叠操作 */
                toggleExpandAll: function() {
                    this.refreshTable = false;
                    this.isExpandAll = !this.isExpandAll;
                    this.$nextTick(function() {
                        this.refreshTable = true;
                    });
                },
                /** 表单重置 */
                reset: function() {
                    this.form = {
                        deptId: undefined,
                        parentId: undefined,
                        deptName: undefined,
                        orderNum: undefined,
                        leader: undefined,
                        phone: undefined,
                        email: undefined,
                        status: '0'
                    };
                    this.resetForm('form');
                },
                /** 新增按钮操作 */
                handleAdd: function(row) {
                    this.reset();
                    this.getTreeselect();
                    if (row !== undefined && row.deptId) {
                        this.form.parentId = row.deptId;
                    } else {
                        this.form.parentId = 0;
                    }
                    this.open = true;
                    this.title = '添加部门';
                },
                /** 修改按钮操作 */
                handleUpdate: function(row) {
                    this.reset();
                    this.getTreeselectExclude(row.deptId);
                    ruoyi.get('/system/dept/' + row.deptId, function(res) {
                        this.form = res.data;
                        this.open = true;
                        this.title = '修改部门';
                    }.bind(this));
                },
                /** 提交按钮 */
                submitForm: function() {
                    this.$refs['form'].validate(function(valid) {
                        if (valid) {
                            if (this.form.deptId !== undefined) {
                                ruoyi.put('/system/dept', this.form, function(res) {
                                    this.$modal.msgSuccess('修改成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            } else {
                                ruoyi.post('/system/dept', this.form, function(res) {
                                    this.$modal.msgSuccess('新增成功');
                                    this.open = false;
                                    this.getList();
                                }.bind(this));
                            }
                        }
                    }.bind(this));
                },
                /** 取消按钮 */
                cancel: function() {
                    this.open = false;
                    this.reset();
                },
                /** 删除按钮操作 */
                handleDelete: function(row) {
                    this.$modal.confirm('是否确认删除名称为"' + row.deptName + '"的数据项？').then(function() {
                        ruoyi.del('/system/dept/' + row.deptId, function(res) {
                            this.getList();
                            this.$modal.msgSuccess('删除成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                }
            },
            created: function() {
                this.getList();
                ruoyi.getDicts('sys_normal_disable', function(data) {
                    this.statusOptions = data;
                }.bind(this));
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>调度日志</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
    <link rel="stylesheet" href="../../static/ruoyi.css">
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="c-panel">
            <!-- 检索参数 -->
            <div class="c-title">调度日志</div>
            <el-form :inline="true" :model="queryParams" ref="queryForm" @submit.native.prevent>
                <el-form-item label="任务名称" prop="jobName">
                    <el-input v-model="queryParams.jobName" placeholder="请输入任务名称" clearable size="small" style="width: 200px;" @keyup.enter.native="handleQuery"></el-input>
                </el-form-item>
                <el-form-item label="任务组名" prop="jobGroup">
                    <el-select v-model="queryParams.jobGroup" placeholder="请选择任务组名" clearable size="small" style="width: 200px;">
                        <el-option v-for="dict in sysJobGroupOptions" :key="dict.value" :label="dict.label" :value="dict.value"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="执行状态" prop="status">
                    <el-select v-model="queryParams.status" placeholder="请选择执行状态" clearable size="small" style="width: 200px;">
                        <el-option v-for="dict in sysCommonStatusOptions" :key="dict.value" :label="dict.label" :value="dict.value"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="执行时间">
                    <el-date-picker v-model="dateRange" size="small" style="width: 240px;" value-format="yyyy-MM-dd" type="daterange" range-separator="-" start-placeholder="开始日期" end-placeholder="结束日期"></el-date-picker>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" icon="el-icon-search" size="mini" @click="handleQuery">搜索</el-button>
                    <el-button icon="el-icon-refresh" size="mini" @click="resetQuery">重置</el-button>
                </el-form-item>
            </el-form>

            <!-- 操作按钮 -->
            <el-row :gutter="10" class="mb8">
                <el-col :span="1.5">
                    <el-button type="danger" plain icon="el-icon-delete" size="mini" :disabled="multiple" @click="handleDelete" v-hasPermi="['monitor:job:remove']">删除</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="danger" plain icon="el-icon-delete" size="mini" @click="handleClean" v-hasPermi="['monitor:job:remove']">清空</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="warning" plain icon="el-icon-download" size="mini" @click="handleExport" v-hasPermi="['monitor:job:export']">导出</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="warning" plain icon="el-icon-close" size="mini" @click="handleClose">关闭</el-button>
                </el-col>
            </el-row>

            <!-- 数据列表 -->
            <el-table :data="jobLogList" size="small" v-loading="loading" @selection-change="handleSelectionChange">
                <el-table-column type="selection" width="55" align="center"></el-table-column>
                <el-table-column label="日志编号" align="center" prop="jobLogId" width="80"></el-table-column>
                <el-table-column label="任务名称" align="center" prop="jobName" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="任务组名" align="center" prop="jobGroup" :show-overflow-tooltip="true">
                    <template slot-scope="scope">
                        <span>{{ selectDictLabel(sysJobGroupOptions, scope.row.jobGroup) }}</span>
                    </template>
                </el-table-column>
                <el-table-column label="调用目标字符串" align="center" prop="invokeTarget" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="日志信息" align="center" prop="jobMessage" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="执行状态" align="center" prop="status" width="100">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.status === '0' ? 'success' : 'danger'" size="small">{{ selectDictLabel(sysCommonStatusOptions, scope.row.status) }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="执行时间" align="center" prop="createTime" width="180">
                    <template slot-scope="scope">
                        <span>{{ parseTime(scope.row.createTime) }}</span>
                    </template>
                </el-table-column>
                <el-table-column label="操作" align="center" class-name="fixed-width" width="100">
                    <template slot-scope="scope">
                        <el-button size="mini" type="text" icon="el-icon-view" @click="handleView(scope.row)">详细</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <div class="pagination-container">
                <el-pagination background layout="total, sizes, prev, pager, next, jumper" :current-page.sync="queryParams.pageNum" :page-size.sync="queryParams.pageSize" :page-sizes="[10, 20, 50, 100]" :total="total" @size-change="getList" @current-change="getList"></el-pagination>
            </div>
        </div>

        <!-- 调度日志详细对话框 -->
        <el-dialog title="调度日志详细" :visible.sync="openView" width="700px" append-to-body>
            <el-form ref="viewForm" :model="form" label-width="120px" size="mini">
                <el-row>
                    <el-col :span="12">
                        <el-form-item label="日志序号：">{{ form.jobLogId }}</el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="任务名称：">{{ form.jobName }}</el-form-item>
                    </el-col>
                </el-row>
                <el-row>
                    <el-col :span="12">
                        <el-form-item label="任务分组：">{{ form.jobGroup }}</el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="执行状态：">
                            <span v-if="form.status === '0'">正常</span>
                            <span v-else-if="form.status === '1'">失败</span>
                        </el-form-item>
                    </el-col>
                </el-row>
                <el-row>
                    <el-col :span="24">
                        <el-form-item label="调用方法：">{{ form.invokeTarget }}</el-form-item>
                    </el-col>
                </el-row>
                <el-row>
                    <el-col :span="24">
                        <el-form-item label="日志信息：">{{ form.jobMessage }}</el-form-item>
                    </el-col>
                </el-row>
                <el-row v-if="form.status === '1'">
                    <el-col :span="24">
                        <el-form-item label="异常信息：">{{ form.exceptionInfo }}</el-form-item>
                    </el-col>
                </el-row>
                <el-row>
                    <el-col :span="24">
                        <el-form-item label="执行时间：">{{ form.createTime }}</el-form-item>
                    </el-col>
                </el-row>
            </el-form>
            <div slot="footer" class="dialog-footer">
                <el-button @click="openView = false">关 闭</el-button>
            </div>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/kj/layer/layer.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/ruoyi-util.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                // 遮罩层
                loading: true,
                // 选中数组
                ids: [],
                // 非多个禁用
                multiple: true,
                // 总条数
                total: 0,
                // 调度日志表格数据
                jobLogList: [],
                // 是否显示详细弹出层
                openView: false,
                // 日期范围
                dateRange: [],
                // 表单参数
                form: {},
                // 任务组名字典
                sysJobGroupOptions: [],
                // 执行状态字典
                sysCommonStatusOptions: [],
                // URL参数
                jobId: undefined,
                jobName: undefined,
                // 查询参数
                queryParams: {
                    pageNum: 1,
                    pageSize: 10,
                    jobName: undefined,
                    jobGroup: undefined,
                    status: undefined
                }
            },
            methods: {
                /** 查询调度日志列表 */
                getList: function() {
                    this.loading = true;
                    var params = this.addDateRange(this.queryParams, this.dateRange);
                    ruoyi.get('/monitor/jobLog/list', params, function(res) {
                        this.jobLogList = res.rows;
                        this.total = res.total;
                        this.loading = false;
                    }.bind(this));
                },
                /** 搜索按钮操作 */
                handleQuery: function() {
                    this.queryParams.pageNum = 1;
                    this.getList();
                },
                /** 重置按钮操作 */
                resetQuery: function() {
                    this.dateRange = [];
                    this.resetForm('queryForm');
                    this.queryParams.jobName = this.jobName || undefined;
                    this.queryParams.jobGroup = undefined;
                    this.queryParams.status = undefined;
                    this.queryParams.pageNum = 1;
                    this.handleQuery();
                },
                /** 多选框选中数据 */
                handleSelectionChange: function(selection) {
                    this.ids = selection.map(function(item) { return item.jobLogId; });
                    this.multiple = !selection.length;
                },
                /** 详细按钮操作 */
                handleView: function(row) {
                    this.form = row;
                    this.openView = true;
                },
                /** 删除按钮操作 */
                handleDelete: function(row) {
                    var jobLogIds = this.ids;
                    this.$modal.confirm('是否确认删除调度日志编号为"' + jobLogIds + '"的数据项？').then(function() {
                        ruoyi.del('/monitor/jobLog/' + jobLogIds.join(','), function(res) {
                            this.getList();
                            this.$modal.msgSuccess('删除成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 清空按钮操作 */
                handleClean: function() {
                    this.$modal.confirm('是否确认清空所有调度日志数据项？').then(function() {
                        ruoyi.del('/monitor/jobLog/clean', function(res) {
                            this.getList();
                            this.$modal.msgSuccess('清空成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 导出按钮操作 */
                handleExport: function() {
                    var params = this.addDateRange(this.queryParams, this.dateRange);
                    this.$modal.confirm('是否确认导出所有调度日志数据项？').then(function() {
                        ruoyi.download('/monitor/jobLog/export', params, 'jobLog.xlsx');
                    }.bind(this)).catch(function() {});
                },
                /** 关闭按钮操作 */
                handleClose: function() {
                    var tabId = 'job-log-' + (this.jobId || 'all');
                    parent.sa_admin.closeTabById(tabId);
                }
            },
            created: function() {
                // 从URL获取参数
                this.jobId = ruoyi.getQueryParam('jobId');
                this.jobName = ruoyi.getQueryParam('jobName');
                if (this.jobName) {
                    this.queryParams.jobName = this.jobName;
                }
                this.getList();
                ruoyi.loadDicts(this, ['sys_job_group', 'sys_common_status']);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>登录日志</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.13.0/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="../../static/sa.css">
    <link rel="stylesheet" href="../../static/ruoyi.css">
</head>
<body>
    <div class="vue-box" style="display: none;" :style="'display: block;'">
        <div class="c-panel">
            <!-- 检索参数 -->
            <div class="c-title">登录日志</div>
            <el-form :inline="true" :model="queryParams" ref="queryForm" @submit.native.prevent>
                <el-form-item label="登录地址" prop="ipaddr">
                    <el-input v-model="queryParams.ipaddr" placeholder="请输入登录地址" clearable size="small" style="width: 200px;" @keyup.enter.native="handleQuery"></el-input>
                </el-form-item>
                <el-form-item label="用户名称" prop="userName">
                    <el-input v-model="queryParams.userName" placeholder="请输入用户名称" clearable size="small" style="width: 200px;" @keyup.enter.native="handleQuery"></el-input>
                </el-form-item>
                <el-form-item label="状态" prop="status">
                    <el-select v-model="queryParams.status" placeholder="登录状态" clearable size="small" style="width: 200px;">
                        <el-option label="成功" value="0"></el-option>
                        <el-option label="失败" value="1"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="登录时间">
                    <el-date-picker v-model="dateRange" size="small" style="width: 240px;" value-format="yyyy-MM-dd" type="daterange" range-separator="-" start-placeholder="开始日期" end-placeholder="结束日期"></el-date-picker>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" icon="el-icon-search" size="mini" @click="handleQuery">搜索</el-button>
                    <el-button icon="el-icon-refresh" size="mini" @click="resetQuery">重置</el-button>
                </el-form-item>
            </el-form>

            <!-- 操作按钮 -->
            <el-row :gutter="10" class="mb8">
                <el-col :span="1.5">
                    <el-button type="danger" plain icon="el-icon-delete" size="mini" :disabled="multiple" @click="handleDelete" v-hasPermi="['monitor:logininfor:remove']">删除</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="danger" plain icon="el-icon-delete" size="mini" @click="handleClean" v-hasPermi="['monitor:logininfor:remove']">清空</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="primary" plain icon="el-icon-unlock" size="mini" :disabled="single" @click="handleUnlock" v-hasPermi="['monitor:logininfor:unlock']">解锁</el-button>
                </el-col>
                <el-col :span="1.5">
                    <el-button type="warning" plain icon="el-icon-download" size="mini" @click="handleExport" v-hasPermi="['monitor:logininfor:export']">导出</el-button>
                </el-col>
            </el-row>

            <!-- 数据列表 -->
            <el-table :data="list" size="small" @selection-change="handleSelectionChange" v-loading="loading" @sort-change="handleSortChange">
                <el-table-column type="selection" width="55" align="center"></el-table-column>
                <el-table-column label="访问编号" align="center" prop="infoId" width="100"></el-table-column>
                <el-table-column label="用户名称" align="center" prop="userName" sortable="custom" :sort-orders="['descending', 'ascending']" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="登录地址" align="center" prop="ipaddr" width="140" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="登录地点" align="center" prop="loginLocation" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="浏览器" align="center" prop="browser" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="操作系统" align="center" prop="os" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="登录状态" align="center" prop="status" width="100">
                    <template slot-scope="scope">
                        <el-tag :type="scope.row.status === '0' ? 'success' : 'danger'" size="small">{{ scope.row.status === '0' ? '成功' : '失败' }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="操作信息" align="center" prop="msg" :show-overflow-tooltip="true"></el-table-column>
                <el-table-column label="登录日期" align="center" prop="loginTime" sortable="custom" :sort-orders="['descending', 'ascending']" width="180">
                    <template slot-scope="scope">
                        <span>{{ parseTime(scope.row.loginTime) }}</span>
                    </template>
                </el-table-column>
            </el-table>

            <!-- 分页 -->
            <div class="pagination-container">
                <el-pagination background layout="total, sizes, prev, pager, next, jumper" :current-page.sync="queryParams.pageNum" :page-size.sync="queryParams.pageSize" :page-sizes="[10, 20, 50, 100]" :total="total" @size-change="getList" @current-change="getList"></el-pagination>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@2.6.10/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui@2.13.0/lib/index.js"></script>
    <script src="https://unpkg.com/jquery@3.4.1/dist/jquery.min.js"></script>
    <script src="../../static/kj/layer/layer.js"></script>
    <script src="../../static/sa.js"></script>
    <script src="../../static/ruoyi-util.js"></script>
    <script>
        var app = new Vue({
            el: '.vue-box',
            data: {
                // 遮罩层
                loading: true,
                // 选中数组
                ids: [],
                // 选中的用户名
                selectName: '',
                // 非单个禁用
                single: true,
                // 非多个禁用
                multiple: true,
                // 总条数
                total: 0,
                // 表格数据
                list: [],
                // 日期范围
                dateRange: [],
                // 排序参数
                orderByColumn: undefined,
                isAsc: undefined,
                // 查询参数
                queryParams: {
                    pageNum: 1,
                    pageSize: 10,
                    ipaddr: undefined,
                    userName: undefined,
                    status: undefined
                }
            },
            methods: {
                /** 查询登录日志列表 */
                getList: function() {
                    this.loading = true;
                    var params = this.addDateRange(this.queryParams, this.dateRange);
                    if (this.orderByColumn) {
                        params.orderByColumn = this.orderByColumn;
                        params.isAsc = this.isAsc;
                    }
                    ruoyi.get('/monitor/logininfor/list', params, function(res) {
                        this.list = res.rows;
                        this.total = res.total;
                        this.loading = false;
                    }.bind(this));
                },
                /** 搜索按钮操作 */
                handleQuery: function() {
                    this.queryParams.pageNum = 1;
                    this.getList();
                },
                /** 重置按钮操作 */
                resetQuery: function() {
                    this.dateRange = [];
                    this.resetForm('queryForm');
                    this.queryParams.pageNum = 1;
                    this.queryParams.ipaddr = undefined;
                    this.queryParams.userName = undefined;
                    this.queryParams.status = undefined;
                    this.orderByColumn = undefined;
                    this.isAsc = undefined;
                    this.handleQuery();
                },
                /** 多选框选中数据 */
                handleSelectionChange: function(selection) {
                    this.ids = selection.map(function(item) { return item.infoId; });
                    this.selectName = selection.map(function(item) { return item.userName; });
                    this.single = selection.length !== 1;
                    this.multiple = !selection.length;
                },
                /** 排序触发事件 */
                handleSortChange: function(column) {
                    this.orderByColumn = column.prop;
                    this.isAsc = column.order === 'ascending' ? 'asc' : 'desc';
                    this.getList();
                },
                /** 删除按钮操作 */
                handleDelete: function(row) {
                    var infoIds = row.infoId ? [row.infoId] : this.ids;
                    this.$modal.confirm('是否确认删除访问编号为"' + infoIds + '"的数据项？').then(function() {
                        ruoyi.del('/monitor/logininfor/' + infoIds.join(','), function(res) {
                            this.getList();
                            this.$modal.msgSuccess('删除成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 清空按钮操作 */
                handleClean: function() {
                    this.$modal.confirm('是否确认清空所有登录日志数据项？').then(function() {
                        ruoyi.del('/monitor/logininfor/clean', function(res) {
                            this.getList();
                            this.$modal.msgSuccess('清空成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 解锁按钮操作 */
                handleUnlock: function() {
                    var userName = this.selectName[0];
                    this.$modal.confirm('是否确认解锁用户"' + userName + '"数据项？').then(function() {
                        ruoyi.get('/monitor/logininfor/unlock/' + userName, function(res) {
                            this.$modal.msgSuccess('用户' + userName + '解锁成功');
                        }.bind(this));
                    }.bind(this)).catch(function() {});
                },
                /** 导出按钮操作 */
                handleExport: function() {
                    var params = this.addDateRange(this.queryParams, this.dateRange);
                    this.$modal.confirm('是否确认导出所有登录日志数据项？').then(function() {
                        ruoyi.download('/monitor/logininfor/export', params, 'logininfor.xlsx');
                    }.bind(this)).catch(function() {});
                }
            },
            created: function() {
                this.getList();
            }
        });
    </script>
</body>
</html>
